<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedConnect Campaigns — Sign in</title>

<link id="bootstrap-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="auth-shell">
  <!-- Visual side -->
  <div class="auth-visual">
    <div class="pulse-line"></div>
    <div class="brand-mark" style="position:relative;z-index:1;">
      <span class="dot"></span>
      <span data-i18n="meta.appName">MedConnect Campaigns</span>
    </div>
    <div class="quote" style="position:relative;z-index:1;" data-i18n="login.subtitle">
      Send trusted WhatsApp updates to your doctor network.
    </div>
    <div class="stat-row" style="position:relative;z-index:1;">
      <div><div class="num">12k+</div><div class="label" data-i18n="dashboard.stats.totalDoctors">Total Doctors</div></div>
      <div><div class="num">98%</div><div class="label" data-i18n="dashboard.stats.delivered">Delivered</div></div>
      <div><div class="num">24/7</div><div class="label">Automation</div></div>
    </div>
  </div>

  <!-- Form side -->
  <div class="auth-panel">
    <div class="auth-card">

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex align-items-center gap-2 fw-bold" style="color:var(--mc-primary);">
          <i class="bi bi-heart-pulse-fill fs-4"></i>
          <span data-i18n="meta.appName">MedConnect Campaigns</span>
        </div>
        <div class="d-flex align-items-center gap-2">
          <div class="lang-toggle">
            <button type="button" data-lang-option="en">EN</button>
            <button type="button" data-lang-option="ar">AR</button>
          </div>
          <button type="button" class="icon-btn" id="themeToggleBtn" title="Theme">
            <i class="bi bi-moon-stars" id="themeToggleIcon"></i>
          </button>
        </div>
      </div>

      <h1 class="h4 fw-bold mb-1" data-i18n="login.title">Sign in to your workspace</h1>
      <p class="text-secondary small mb-4" data-i18n="login.demoHint">Demo access: admin / admin123</p>

      <div id="loginAlert" class="alert alert-danger py-2 small d-none" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label" data-i18n="login.username">Username</label>
          <input type="text" class="form-control" id="username" data-i18n-placeholder="login.usernamePlaceholder" autocomplete="username" required>
        </div>
        <div class="mb-3">
          <label class="form-label d-flex justify-content-between">
            <span data-i18n="login.password">Password</span>
            <a href="#" class="small" style="color:var(--mc-accent-dark);" data-i18n="login.forgot">Forgot password?</a>
          </label>
          <div class="input-group">
            <input type="password" class="form-control" id="password" data-i18n-placeholder="login.passwordPlaceholder" autocomplete="current-password" required>
            <button class="btn btn-outline-secondary" type="button" id="togglePassword"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="remember" checked>
          <label class="form-check-label small" for="remember" data-i18n="login.remember">Remember me on this device</label>
        </div>
        <button type="submit" class="btn btn-mc-primary w-100" id="submitBtn">
          <span id="submitLabel" data-i18n="login.submit">Sign in</span>
        </button>
      </form>

      <p class="text-center small mt-3">
        <span class="text-secondary" data-i18n="login.noAccount">Don't have an account?</span>
        <a href="signup.html" style="color:var(--mc-accent-dark);" data-i18n="login.requestAccount">Request one</a>
      </p>

    </div>
  </div>
</div>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script>
  // If already logged in, skip straight to the dashboard.
  if (MCAuth.isLoggedIn()) window.location.href = "dashboard.html";

  document.getElementById("togglePassword").addEventListener("click", () => {
    const input = document.getElementById("password");
    const icon = document.querySelector("#togglePassword i");
    const show = input.type === "password";
    input.type = show ? "text" : "password";
    icon.className = show ? "bi bi-eye-slash" : "bi bi-eye";
  });

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById("loginAlert");
    const btn = document.getElementById("submitBtn");
    const label = document.getElementById("submitLabel");
    alertBox.classList.add("d-none");

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const remember = document.getElementById("remember").checked;

    if (!username || !password) {
      alertBox.textContent = I18N.t("login.errorRequired");
      alertBox.classList.remove("d-none");
      return;
    }

    btn.disabled = true;
    label.textContent = I18N.t("login.submitting");

    try {
      await MCAuth.login(username, password, remember);
      window.location.href = "dashboard.html";
    } catch (err) {
      alertBox.textContent = I18N.t("login.errorInvalid");
      alertBox.classList.remove("d-none");
      btn.disabled = false;
      label.textContent = I18N.t("login.submit");
    }
  });
</script>
</body>
</html>
