<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedConnect Campaigns — Messages</title>

<link id="bootstrap-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .inbox-shell { display: flex; height: calc(100vh - 130px); min-height: 480px; border: 1px solid var(--mc-border); border-radius: var(--mc-radius); overflow: hidden; background: var(--mc-surface); }
  .conv-list { width: 320px; flex-shrink: 0; border-inline-end: 1px solid var(--mc-border); overflow-y: auto; display: flex; flex-direction: column; }
  .conv-item { padding: 12px 14px; border-bottom: 1px solid var(--mc-border); cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
  .conv-item:hover { background: var(--mc-primary-light); }
  .conv-item.active { background: var(--mc-primary-light); border-inline-start: 3px solid var(--mc-primary); }
  .conv-item .conv-name { font-weight: 700; font-size: .88rem; }
  .conv-item .conv-preview { font-size: .8rem; color: var(--mc-ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-item .conv-time { font-size: .68rem; color: var(--mc-ink-soft); }
  .conv-item.unread { background: var(--mc-primary-light); }
  .conv-item.unread .conv-name { font-weight: 800; }
  .conv-item.unread .conv-preview:last-child { color: var(--mc-ink); font-weight: 600; }
  .conv-unread-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--mc-primary); margin-inline-start: 6px; flex-shrink: 0; }
  .conv-filter-bar .btn { font-size: .74rem; padding: 4px 6px; }
  .conv-filter-bar .btn.active { background: var(--mc-primary); border-color: var(--mc-primary); color: #fff; }
  .conv-mark-read-btn { flex-shrink: 0; }
  .thread-pane { flex: 1; display: flex; flex-direction: column; background: #E5DDD5; }
  [data-theme="dark"] .thread-pane { background: #0c1b21; }
  .thread-header { background: var(--mc-surface); padding: 12px 16px; border-bottom: 1px solid var(--mc-border); font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .thread-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg-bubble { width: fit-content; max-width: min(65%, 480px); min-width: 44px; padding: 6px 9px; border-radius: 10px; font-size: .88rem; white-space: pre-wrap; word-break: break-word; box-shadow: 0 1px 1px rgba(0,0,0,.08); }
  .msg-bubble.in { align-self: flex-start; background: #FFFFFF; border-start-start-radius: 2px; }
  [data-theme="dark"] .msg-bubble.in { background: #1f2c33; color: var(--mc-ink); }
  .msg-bubble.out { align-self: flex-end; background: #DCF8C6; color: #111; border-start-end-radius: 2px; }
  .msg-bubble .msg-time { font-size: .65rem; color: #667781; white-space: nowrap; margin-inline-start: 6px; }
  .msg-bubble.pending { opacity: .65; }
  .msg-agent-label { font-size: .68rem; font-weight: 700; color: var(--mc-primary); margin-bottom: 2px; }
  .thread-input { border-top: 1px solid var(--mc-border); background: var(--mc-surface); padding: 10px; display: flex; align-items: flex-end; gap: 8px; }
  .empty-pane { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--mc-ink-soft); font-size: .9rem; }
</style>
</head>
<body data-page="inbox">

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="mark"><i class="bi bi-heart-pulse-fill"></i></span>
      <span data-i18n="meta.appName">MedConnect Campaigns</span>
    </div>
    <nav class="nav flex-column">
      <a class="nav-link" href="dashboard.html" data-page="dashboard">
        <i class="bi bi-grid-1x2-fill"></i> <span data-i18n="nav.dashboard">Dashboard</span>
      </a>
      <a class="nav-link" href="campaigns.html" data-page="campaigns">
        <i class="bi bi-megaphone-fill"></i> <span data-i18n="nav.campaigns">Campaigns</span>
      </a>
      <a class="nav-link" href="doctors.html" data-page="doctors">
        <i class="bi bi-person-badge-fill"></i> <span data-i18n="nav.doctors">Customers</span>
      </a>
      <a class="nav-link" href="templates.html" data-page="templates">
        <i class="bi bi-file-earmark-text-fill"></i> <span data-i18n="nav.templates">Templates</span>
      </a>
      <a class="nav-link" href="history.html" data-page="history">
        <i class="bi bi-clock-history"></i> <span data-i18n="nav.history">History</span>
      </a>
      <a class="nav-link active" href="inbox.html" data-page="inbox">
        <i class="bi bi-chat-dots-fill"></i> <span data-i18n="nav.inbox">Messages</span>
      </a>
      <div class="nav-section-label">—</div>
      <a class="nav-link" href="requests.html" data-page="requests">
        <i class="bi bi-person-plus-fill"></i> <span data-i18n="nav.requests">Signup Requests</span>
      </a>
      <a class="nav-link" href="settings.html" data-page="settings">
        <i class="bi bi-gear-fill"></i> <span data-i18n="nav.settings">Settings</span>
      </a>
      <a class="nav-link" href="#" id="logoutLink">
        <i class="bi bi-box-arrow-left"></i> <span data-i18n="nav.logout">Log out</span>
      </a>
    </nav>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <button class="icon-btn d-lg-none" id="sidebarOpenBtn"><i class="bi bi-list"></i></button>
      <div class="search-box">
        <input type="text" class="form-control" data-i18n-placeholder="topbar.search" placeholder="Search...">
      </div>
      <div class="ms-auto d-flex align-items-center gap-2">
        <div class="lang-toggle">
          <button type="button" data-lang-option="en">EN</button>
          <button type="button" data-lang-option="ar">AR</button>
        </div>
        <button type="button" class="icon-btn" id="themeToggleBtn"><i class="bi bi-moon-stars" id="themeToggleIcon"></i></button>
        <div class="d-flex align-items-center gap-2 ps-2 border-start">
          <div style="width:34px;height:34px;border-radius:50%;background:var(--mc-primary-light);color:var(--mc-primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;" id="userInitials">A</div>
        </div>
      </div>
    </header>

    <main class="content-area">
      <div class="d-flex flex-wrap justify-content-between align-items-start mb-3 gap-2">
        <div>
          <h1 class="h4 fw-bold mb-0" data-i18n="inbox.title">Messages</h1>
          <p class="text-secondary small mb-0" data-i18n="inbox.subtitle">Conversations with customers who messaged you directly.</p>
        </div>
        <button class="btn btn-outline-secondary d-flex align-items-center gap-2" id="refreshBtn">
          <i class="bi bi-arrow-clockwise"></i> <span data-i18n="inbox.refresh">Refresh</span>
        </button>
      </div>

      <div id="notConnectedNote" class="alert alert-warning py-2 small d-none" data-i18n="inbox.notConnected">
        Connect your backend in Settings first to manage real data.
      </div>

      <div class="inbox-shell">
        <div class="conv-list" id="convList">
          <div class="p-2">
            <input type="text" class="form-control form-control-sm" id="convSearch" data-i18n-placeholder="inbox.searchPlaceholder" placeholder="Search conversations...">
          </div>
          <div class="conv-filter-bar btn-group btn-group-sm w-100 px-2 pb-2" role="group">
            <button type="button" class="btn btn-outline-secondary conv-filter-btn active" data-filter="all" data-i18n="inbox.filterAll">All</button>
            <button type="button" class="btn btn-outline-secondary conv-filter-btn" data-filter="unread" data-i18n="inbox.filterUnread">Unread</button>
            <button type="button" class="btn btn-outline-secondary conv-filter-btn" data-filter="replied" data-i18n="inbox.filterRead">Read</button>
          </div>
          <div id="convItems"></div>
        </div>
        <div class="thread-pane" id="threadPane">
          <div class="empty-pane" id="emptyPane" data-i18n="inbox.noThreadSelected">Select a conversation on the left to view it.</div>
          <div id="activeThread" class="d-none" style="display:flex;flex-direction:column;height:100%;">
            <div class="thread-header">
              <div style="width:34px;height:34px;border-radius:50%;background:var(--mc-primary-light);color:var(--mc-primary);display:flex;align-items:center;justify-content:center;"><i class="bi bi-person-fill"></i></div>
              <div>
                <div id="threadName">—</div>
                <div class="small text-secondary" id="threadMobile" dir="ltr">—</div>
              </div>
            </div>
            <div class="thread-body" id="threadBody"></div>
            <div class="thread-input">
              <input type="file" id="attachFileInput" class="d-none" accept="image/*,application/pdf,.doc,.docx">
              <button class="btn btn-outline-secondary" id="attachBtn" title="Attach"><i class="bi bi-paperclip"></i></button>
              <textarea class="form-control" id="replyInput" rows="1" data-i18n-placeholder="inbox.typeMessage" placeholder="Type a reply..." style="resize:none; max-height:140px; overflow-y:auto;"></textarea>              <button class="btn btn-mc-primary" id="sendReplyBtn"><i class="bi bi-send-fill"></i></button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/api.js?v=2"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/inbox.js?v=10"></script>
<script>
  MCAuth.guard();
  const session = MCAuth.getSession();
  if (session) document.getElementById("userInitials").textContent = (session.name || session.username || "A").slice(0, 1).toUpperCase();
  document.getElementById("logoutLink").addEventListener("click", (e) => { e.preventDefault(); MCAuth.logout(); });
</script>
</body>
</html>
