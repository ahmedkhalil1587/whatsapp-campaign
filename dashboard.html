<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedConnect Campaigns — Dashboard</title>

<link id="bootstrap-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="dashboard">

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<div class="app-shell">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="mark"><i class="bi bi-heart-pulse-fill"></i></span>
      <span data-i18n="meta.appName">MedConnect Campaigns</span>
    </div>
    <nav class="nav flex-column">
      <a class="nav-link active" href="dashboard.html" data-page="dashboard">
        <i class="bi bi-grid-1x2-fill"></i> <span data-i18n="nav.dashboard">Dashboard</span>
      </a>
      <a class="nav-link" href="#" data-page="campaigns" data-unbuilt="true">
        <i class="bi bi-megaphone-fill"></i> <span data-i18n="nav.campaigns">Campaigns</span>
      </a>
      <a class="nav-link" href="doctors.html" data-page="doctors">
        <i class="bi bi-person-badge-fill"></i> <span data-i18n="nav.doctors">Doctors</span>
      </a>
      <a class="nav-link" href="#" data-page="templates" data-unbuilt="true">
        <i class="bi bi-file-earmark-text-fill"></i> <span data-i18n="nav.templates">Templates</span>
      </a>
      <a class="nav-link" href="#" data-page="history" data-unbuilt="true">
        <i class="bi bi-clock-history"></i> <span data-i18n="nav.history">History</span>
      </a>
      <div class="nav-section-label">—</div>
      <a class="nav-link" href="settings.html" data-page="settings">
        <i class="bi bi-gear-fill"></i> <span data-i18n="nav.settings">Settings</span>
      </a>
      <a class="nav-link" href="#" id="logoutLink">
        <i class="bi bi-box-arrow-left"></i> <span data-i18n="nav.logout">Log out</span>
      </a>
    </nav>
  </aside>

  <!-- Main -->
  <div class="main-col">
    <header class="topbar">
      <button class="icon-btn d-lg-none" id="sidebarOpenBtn"><i class="bi bi-list"></i></button>
      <div class="search-box">
        <input type="text" class="form-control" data-i18n-placeholder="topbar.search" placeholder="Search...">
      </div>
      <div class="ms-auto d-flex align-items-center gap-2">
        <div class="lang-toggle">
          <button type="button" data-lang-option="en">EN</button>
          <button type="button" data-lang-option="ar">AR</button>
        </div>
        <button type="button" class="icon-btn" id="themeToggleBtn"><i class="bi bi-moon-stars" id="themeToggleIcon"></i></button>
        <div class="d-flex align-items-center gap-2 ps-2 border-start">
          <div style="width:34px;height:34px;border-radius:50%;background:var(--mc-primary-light);color:var(--mc-primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;" id="userInitials">A</div>
        </div>
      </div>
    </header>

    <main class="content-area">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
        <div>
          <h1 class="h4 fw-bold mb-0" id="welcomeText" data-i18n="dashboard.welcome">Welcome back</h1>
          <p class="text-secondary small mb-0" data-i18n="dashboard.welcomeSub">Here's what's happening with your campaigns today.</p>
        </div>
        <button class="btn btn-mc-primary d-flex align-items-center gap-2" id="newCampaignBtn">
          <i class="bi bi-plus-lg"></i> <span data-i18n="dashboard.newCampaign">New campaign</span>
        </button>
      </div>

      <!-- Stat cards -->
      <div class="row g-3 mb-4" id="statCardsRow">
        <!-- populated by dashboard.js -->
      </div>

      <!-- Charts -->
      <div class="row g-3 mb-4">
        <div class="col-lg-7">
          <div class="panel h-100">
            <div class="d-flex justify-content-between align-items-start mb-3">
              <div>
                <div class="panel-title" data-i18n="dashboard.charts.performanceTitle">Delivery performance</div>
                <div class="panel-sub" data-i18n="dashboard.charts.performanceSub">Last 7 campaigns</div>
              </div>
            </div>
            <canvas id="performanceChart" height="140"></canvas>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="panel h-100">
            <div class="panel-title mb-3" data-i18n="dashboard.charts.statusTitle">Message status split</div>
            <canvas id="statusChart" height="180"></canvas>
          </div>
        </div>
      </div>

      <!-- Recent campaigns -->
      <div class="panel">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="panel-title mb-0" data-i18n="dashboard.recent.title">Recent campaigns</div>
          <a href="#" class="small fw-semibold" style="color:var(--mc-accent-dark);" data-i18n="dashboard.recent.viewAll">View all</a>
        </div>
        <div class="table-responsive">
          <table class="table table-mc mb-0">
            <thead>
              <tr>
                <th data-i18n="dashboard.recent.name">Campaign</th>
                <th data-i18n="dashboard.recent.date">Date</th>
                <th data-i18n="dashboard.recent.recipients">Recipients</th>
                <th data-i18n="dashboard.recent.delivered">Delivered</th>
                <th data-i18n="dashboard.recent.status">Status</th>
              </tr>
            </thead>
            <tbody id="recentCampaignsBody">
              <!-- populated by dashboard.js -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/dashboard.js"></script>
<script>
  MCAuth.guard();
  const session = MCAuth.getSession();
  if (session) {
    document.getElementById("userInitials").textContent = (session.name || session.username || "A").slice(0, 1).toUpperCase();
  }
  document.getElementById("logoutLink").addEventListener("click", (e) => { e.preventDefault(); MCAuth.logout(); });

  // Nav items for pages not built yet in this phase show a friendly toast instead of 404.
  document.querySelectorAll('.sidebar .nav-link[data-unbuilt="true"]').forEach((link) => {
    link.addEventListener("click", (e) => {
      e.preventDefault();
      MCApp.toast(I18N.t("common.comingSoon"));
    });
  });
  document.getElementById("newCampaignBtn").addEventListener("click", () => MCApp.toast(I18N.t("common.comingSoon")));
</script>
</body>
</html>
