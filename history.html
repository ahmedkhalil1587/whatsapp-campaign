<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedConnect Campaigns — History</title>

<link id="bootstrap-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="history">

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="mark"><i class="bi bi-heart-pulse-fill"></i></span>
      <span data-i18n="meta.appName">MedConnect Campaigns</span>
    </div>
    <nav class="nav flex-column">
      <a class="nav-link" href="dashboard.html" data-page="dashboard">
        <i class="bi bi-grid-1x2-fill"></i> <span data-i18n="nav.dashboard">Dashboard</span>
      </a>
      <a class="nav-link" href="campaigns.html" data-page="campaigns">
        <i class="bi bi-megaphone-fill"></i> <span data-i18n="nav.campaigns">Campaigns</span>
      </a>
      <a class="nav-link" href="doctors.html" data-page="doctors">
        <i class="bi bi-person-badge-fill"></i> <span data-i18n="nav.doctors">Customers</span>
      </a>
      <a class="nav-link" href="templates.html" data-page="templates">
        <i class="bi bi-file-earmark-text-fill"></i> <span data-i18n="nav.templates">Templates</span>
      </a>
      <a class="nav-link active" href="history.html" data-page="history">
        <i class="bi bi-clock-history"></i> <span data-i18n="nav.history">History</span>
      </a>
      <a class="nav-link" href="inbox.html" data-page="inbox">
        <i class="bi bi-chat-dots-fill"></i> <span data-i18n="nav.inbox">Messages</span>
      </a>
      <div class="nav-section-label">—</div>
      <a class="nav-link" href="settings.html" data-page="settings">
        <i class="bi bi-gear-fill"></i> <span data-i18n="nav.settings">Settings</span>
      </a>
      <a class="nav-link" href="#" id="logoutLink">
        <i class="bi bi-box-arrow-left"></i> <span data-i18n="nav.logout">Log out</span>
      </a>
    </nav>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <button class="icon-btn d-lg-none" id="sidebarOpenBtn"><i class="bi bi-list"></i></button>
      <div class="search-box">
        <input type="text" class="form-control" data-i18n-placeholder="topbar.search" placeholder="Search...">
      </div>
      <div class="ms-auto d-flex align-items-center gap-2">
        <div class="lang-toggle">
          <button type="button" data-lang-option="en">EN</button>
          <button type="button" data-lang-option="ar">AR</button>
        </div>
        <button type="button" class="icon-btn" id="themeToggleBtn"><i class="bi bi-moon-stars" id="themeToggleIcon"></i></button>
        <div class="d-flex align-items-center gap-2 ps-2 border-start">
          <div style="width:34px;height:34px;border-radius:50%;background:var(--mc-primary-light);color:var(--mc-primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;" id="userInitials">A</div>
        </div>
      </div>
    </header>

    <main class="content-area">
      <div class="d-flex flex-wrap justify-content-between align-items-start mb-4 gap-2">
        <div>
          <h1 class="h4 fw-bold mb-0" data-i18n="history.title">History</h1>
          <p class="text-secondary small mb-0" data-i18n="history.subtitle">Every message ever sent, across all campaigns.</p>
        </div>
        <button class="btn btn-outline-secondary d-flex align-items-center gap-2" id="exportBtn">
          <i class="bi bi-download"></i> <span data-i18n="history.exportExcel">Export Excel</span>
        </button>
      </div>

      <div id="notConnectedNote" class="alert alert-warning py-2 small d-none" data-i18n="history.notConnected">
        Connect your backend in Settings first to manage real data.
      </div>

      <div class="panel">
        <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
          <div class="flex-grow-1" style="min-width:240px;max-width:380px;">
            <input type="text" class="form-control" id="searchInput" data-i18n-placeholder="history.searchPlaceholder" placeholder="Search by customer, mobile, or campaign...">
          </div>
          <select class="form-select" id="statusFilter" style="max-width:180px;">
            <option value="" data-i18n="history.filterAll">All statuses</option>
            <option value="sent" data-i18n="history.filterSent">Sent</option>
            <option value="failed" data-i18n="history.filterFailed">Failed</option>
          </select>
        </div>

        <div class="table-responsive">
          <table class="table table-mc mb-0">
            <thead>
              <tr>
                <th data-i18n="history.col.time">Time</th>
                <th data-i18n="history.col.campaign">Campaign</th>
                <th data-i18n="history.col.customer">Customer</th>
                <th data-i18n="history.col.mobile">Mobile</th>
                <th data-i18n="history.col.status">Status</th>
              </tr>
            </thead>
            <tbody id="historyBody"></tbody>
          </table>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-3">
          <div class="small text-secondary" id="pageInfo"></div>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary btn-sm" id="prevPageBtn"><span data-i18n="history.prev">Previous</span></button>
            <button class="btn btn-outline-secondary btn-sm" id="nextPageBtn"><span data-i18n="history.next">Next</span></button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/history.js"></script>
<script>
  MCAuth.guard();
  const session = MCAuth.getSession();
  if (session) document.getElementById("userInitials").textContent = (session.name || session.username || "A").slice(0, 1).toUpperCase();
  document.getElementById("logoutLink").addEventListener("click", (e) => { e.preventDefault(); MCAuth.logout(); });
</script>
</body>
</html>
